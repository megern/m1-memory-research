[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m1-research-audit"
version = "0.2.0"
description = "Read-only frozen local research audit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/megern/m1-memory-research"
Issues = "https://github.com/megern/m1-memory-research/issues"

[project.optional-dependencies]
plots = ["matplotlib>=3.10,<4"]

[project.scripts]
m1-research-audit = "audit_sms_confirmation:main"
m1-training-resource-audit = "audit_training_resources:main"

[tool.setuptools]
py-modules = ["audit_sms_confirmation", "public_sms_study", "audit_training_resources"]

package-dir = {"" = "tools"}
